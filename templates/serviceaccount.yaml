{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
{{- /* kindIs instead of default: default turned an explicit false into true. */}}
automountServiceAccountToken: {{ if kindIs "bool" .Values.serviceAccount.automountServiceAccountToken }}{{ .Values.serviceAccount.automountServiceAccountToken }}{{ else }}true{{ end }}
metadata:
  labels:
    {{- include "universal.labels" . | nindent 4 }}
    {{- with .Values.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- tpl (toYaml . | nindent 4) $ }}
  {{- end }}
  name: {{ include "universal.serviceAccountName" . }}
  namespace: {{ include "universal.namespace" . }}
{{- end }}
